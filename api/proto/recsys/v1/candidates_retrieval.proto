syntax = "proto3";

package recsys.v1;

option go_package = "recsys-workshop/pkg/pb;pb";

message GetCandidatesRequest {
  uint64 user_id = 1;
  uint32 limit = 2;
}

// Iterations 1 and 2: thin candidates (pull model).
message ThinCandidatesResponse {
  repeated uint64 ids = 1;
}

message Metadata {
  uint64 seller_id = 1;
  uint32 category_id = 2;
  uint32 brand_id = 3;
  uint32 flags = 4;
  float item_weight = 5;
  uint32 warehouse_id = 6;
}

message AdvBids {
  uint64 campaign_id = 1;
  float cpc_bid = 2;
  float cpm_bid = 3;
  uint32 target_slot = 4;
}

// Iteration 3: classic AoS (Array of Structs).
message Candidate {
  uint64 id = 1;
  Metadata metadata = 2;
  AdvBids adv_bids = 3;
  float retrieval_score = 4;
}

message RetrievalResponse {
  repeated Candidate candidates = 1;
}

// Iteration 4: hybrid SoA / Parallel Arrays at the batch level.
message CandidateBatchResponse {
  repeated uint64 ids = 1;
  repeated float retrieval_scores = 2;
  repeated Metadata metadata = 3; // []*Metadata in Go.
  repeated AdvBids adv_bids = 4; // []*AdvBids in Go.
}

service CandidatesRetrievalService {
  rpc GetThinCandidates(GetCandidatesRequest) returns (ThinCandidatesResponse);
  rpc GetFatCandidatesAoS(GetCandidatesRequest) returns (RetrievalResponse);
  rpc GetFatCandidatesBatch(GetCandidatesRequest) returns (CandidateBatchResponse);
}
